<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-3210396314688497">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WonderLabs - Ultimate Media Studio Pro</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
    <style>
        :root { 
            --primary: #0070f3; 
            --primary-glow: rgba(0, 112, 243, 0.3);
            --success: #00ac47;
            --bg: #050505; 
            --panel: #111111; 
            --panel-secondary: #1a1a1a;
            --border: #222222; 
            --text: #ffffff; 
            --text-muted: #888888;
        }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; -webkit-font-smoothing: antialiased; }
        .container { max-width: 1200px; width: 95%; margin: 20px auto; padding: 10px; box-sizing: border-box; }
        
        /* MODERN HEADER */
        .header-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 26px; font-weight: 800; background: linear-gradient(45deg, #0070f3, #00dfd8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        .lang-selector { background: var(--panel); color: white; padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .lang-selector:hover { border-color: var(--primary); }
        
        .ad-space { background: var(--panel); margin: 15px 0; padding: 15px; color: #444; border: 1px solid var(--border); border-radius: 8px; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* KULLANICI DOSTU SÜRÜKLE-BIRAK ALANI */
        .upload-box { border: 2px dashed #333; padding: 60px 20px; border-radius: 16px; cursor: pointer; background: var(--panel); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .upload-box:hover { border-color: var(--primary); background: #141414; box-shadow: 0 0 30px var(--primary-glow); transform: translateY(-2px); }
        .upload-icon { font-size: 40px; margin-bottom: 15px; display: block; }

        /* DEVSAL STÜDYO GRID APARATI */
        .studio-grid { display: none; grid-template-columns: 1fr 420px; gap: 25px; margin-top: 20px; text-align: left; }
        @media (max-width: 950px) { .studio-grid { grid-template-columns: 1fr; } }
        
        /* SOL TARAF: ÖNİZLEME LABS */
        .preview-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .player-wrapper { width: 100%; position: relative; background: #000; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; max-height: 480px; display: none; transition: filter 0.2s ease; }
        audio { width: 100%; margin: 20px 0; display: none; }
        
        /* CANLI SES DALGASI SİMÜLASYONU */
        .waveform-sim { width: 100%; height: 50px; display: flex; align-items: center; gap: 3px; margin-top: 15px; background: #000; padding: 10px; border-radius: 8px; box-sizing: border-box; border: 1px solid #1a1a1a; }
        .bar { flex: 1; height: 30%; background: #222; border-radius: 3px; transition: height 0.1s ease; }
        .playing .bar { background: linear-gradient(to top, var(--primary), #00dfd8); animation: pulse 0.6s infinite alternate; }
        .playing .bar:nth-child(2n) { animation-delay: 0.1s; animation-duration: 0.4s; }
        .playing .bar:nth-child(3n) { animation-delay: 0.2s; animation-duration: 0.5s; }
        .playing .bar:nth-child(4n) { animation-delay: 0.3s; animation-duration: 0.3s; }
        @keyframes pulse { 0% { height: 15%; } 100% { height: 100%; } }

        .player-controls { display: flex; gap: 12px; width: 100%; margin-top: 15px; }

        /* SAĞ TARAF: SEKMELİ KONTROL PANELİ (KAFALARI KARIŞTIRMAZ) */
        .control-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        
        /* MODERN SEKMELER (TABS) */
        .tabs-nav { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; gap: 5px; overflow-x: auto; }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 10px 15px; font-size: 14px; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; white-space: nowrap; }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        
        /* SEKME İÇERİKLERİ */
        .tab-content { display: none; flex-direction: column; gap: 18px; min-height: 280px; }
        .tab-content.active { display: flex; }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .slider-container { display: flex; align-items: center; gap: 12px; background: var(--panel-secondary); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        input[type="range"] { flex: 1; accent-color: var(--primary); cursor: pointer; height: 6px; border-radius: 3px; }
        .val-badge { background: #2a2a2a; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; min-width: 40px; text-align: center; }
        
        .flex-inputs { display: flex; gap: 12px; }
        .flex-inputs div { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        input[type="number"], select { background: var(--panel-secondary); color: white; border: 1px solid var(--border); padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; transition: border-color 0.2s; }
        input[type="number"]:focus, select:focus { border-color: var(--primary); outline: none; }
        
        /* BUTON TASARIMLARI */
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; }
        .btn:hover { background: #0051a8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0, 112, 243, 0.2); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: var(--panel-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #252525; border-color: #444; box-shadow: none; }
        .btn-success { background: var(--success); width: 100%; font-size: 16px; padding: 15px; border-radius: 10px; margin-top: auto; box-shadow: 0 4px 15px rgba(0,172,71,0.3); }
        .btn-success:hover { background: #008f3a; box-shadow: 0 6px 20px rgba(0,172,71,0.5); }
        
        /* STATUS ENGINE */
        .status-box { display: none; background: #091a10; border: 1px solid #124024; padding: 14px; border-radius: 8px; font-size: 13px; text-align: center; color: #00ff66; font-weight: 600; margin-top: 15px; box-shadow: inset 0 0 10px rgba(0,255,102,0.05); }
    </style>
</head>
